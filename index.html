<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Asset Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --panel-2: #181c25; --line: #232835; --text: #e6e9ef; --muted: #8a93a6;
    --accent: #5cf2ff; --accent-2: #3fb8ff; --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 18px 18px 12px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; letter-spacing: 0.2px; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 4px; padding: 0 12px 10px; }
  .tabs button { flex: 1 1 auto; background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 7px 6px; border-radius: 8px; font: inherit; font-size: 12px; white-space: nowrap; cursor: pointer; }
  .tabs button.on { background: var(--panel-2); color: var(--text); border-color: #344055; }
  .search { margin: 0 12px 8px; }
  .search input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px 10px; font: inherit; outline: none; }
  .search input:focus { border-color: var(--accent-2); }
  .list { overflow: auto; flex: 1; padding: 0 8px 16px; }
  .group-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; padding: 12px 8px 6px; display: flex; justify-content: space-between; }
  .item { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); font: inherit; padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item:hover { background: var(--panel-2); }
  .item.on { background: #1d2a38; color: var(--accent); }
  .item small { color: var(--muted); margin-left: 6px; font-size: 11px; }
  main { position: relative; min-width: 0; }
  #view { position: absolute; inset: 0; }
  .toolbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
  .toolbar > * { pointer-events: auto; }
  .chip, select.chip { background: rgba(18,21,28,0.85); backdrop-filter: blur(8px); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 7px 11px; font: inherit; font-size: 12px; cursor: pointer; }
  .chip.on { border-color: var(--accent-2); color: var(--accent); }
  .chip:disabled { opacity: 0.4; cursor: default; }
  .info { position: absolute; left: 12px; bottom: 12px; right: 12px; max-width: 640px; background: rgba(18,21,28,0.9); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .info h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .info .meta { color: var(--muted); font-size: 12px; }
  .info .meta a { color: var(--accent-2); }
  .badge { display: inline-block; background: #12341f; color: #5fe39a; border-radius: 5px; font-size: 11px; padding: 1px 6px; margin-right: 6px; font-weight: 500; }
  pre { margin: 10px 0 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 12px/1.5 'JetBrains Mono', monospace; color: #b9c3d6; overflow-x: auto; position: relative; }
  pre button { position: absolute; top: 6px; right: 6px; }
  .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: 12px; display: none; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; }
    aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
    .info pre { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Game Asset Library</h1>
      <p id="count">Loading…</p>
    </header>
    <div class="tabs" id="tabs">
      <button data-tab="models" class="on">Models</button>
      <button data-tab="garage">Garage</button>
      <button data-tab="vfx">VFX</button>
      <button data-tab="powerups">Power-ups</button>
      <button data-tab="materials">Materials</button>
      <button data-tab="audio">Audio</button>
    </div>
    <div class="search"><input id="q" placeholder="Search models…" autocomplete="off"></div>
    <div class="list" id="list"></div>
  </aside>
  <main>
    <div id="view"></div>
    <div class="toolbar" id="toolbar"></div>
    <div class="loading" id="loading">Loading…</div>
    <div class="info" id="info"></div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createStage } from './src/stage.js';
import { AssetLibrary, fitToSize, recolor, SKIN_TONES, HAIR_TONES } from './src/library.js';
import { VFX } from './src/vfx.js';
import { createPowerUp, POWERUP_TYPES } from './src/powerups.js';
import { SoundBoard, SFX_PRESETS, ENGINE_LOOPS } from './src/sfx.js';
import { loadVehicle } from './src/vehicle.js';
import { PARTS } from './src/parts.js';

const $ = (id) => document.getElementById(id);
const lib = await AssetLibrary.load('./assets/');
const stage = createStage($('view'));
const { scene, camera, renderer } = stage;
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const vfx = await new VFX(scene, { spriteBase: './assets/vfx/sprites/' }).init();
const sfx = new SoundBoard(camera, { base: './assets/', volume: 0.6 }).attach(scene);
const sounds = lib.find({ type: 'sound' });
const clock = new THREE.Clock();

const HDRIS = lib.find({ type: 'hdri' });
const GROUP_LABELS = {
  'base-characters/people': 'Base characters: people', 'base-characters/modular': 'Base characters: modular', 'base-characters/simple': 'Base characters: simple',
  'mechs': 'Mechs', 'mechs/space': 'Mechs: space crew',
  'characters/cyberpunk': 'Hero: cyberpunk', 'characters/soldiers': 'Soldiers', 'characters/astronauts': 'Astronauts', 'characters/robot': 'Robot',
  'enemies/cyberpunk': 'Enemies: cyberpunk', 'enemies/space': 'Enemies: space', 'enemies/monsters-big': 'Monsters: big',
  'enemies/monsters-blob': 'Monsters: blob', 'enemies/monsters-flying': 'Monsters: flying',
  'weapons/guns': 'Guns', 'weapons/blasters': 'Blasters', 'turrets': 'Turrets', 'turrets/cyberpunk': 'Turrets: cyberpunk',
  'pickups/space': 'Pickups', 'vehicles/space': 'Vehicles: space', 'space/ships': 'Spaceships', 'space/kit': 'Space kit',
  'vehicles/racing': 'Vehicles: racing', 'vehicles/cars': 'Vehicles: cars', 'vehicles/toon': 'Vehicles: toon', 'vehicles/city': 'Vehicles: city', 'vehicles/classic': 'Vehicles: classic', 'vehicles/basic': 'Vehicles: basic',
  'environment/race-track': 'Race track', 'props/road': 'Road props', 'props/road-basic': 'Road props: basic',
  'environment/planet': 'Planet outpost', 'environment/space-station': 'Space station', 'environment/prototype': 'Prototype / blockout',
};
const models = lib.find({ type: 'model' });
$('count').textContent = `${lib.assets.length} CC0 assets · ${models.length} models · ${sounds.length} sounds · free for commercial use`;

let content = new THREE.Group(); scene.add(content);
let updaters = [];
let current = null, tab = 'models';
const settings = { hdri: '', bg: false, bloom: true, ao: true };

function clearContent() {
  for (const fx of [...vfx.effects]) { fx.dispose?.(); vfx.effects.delete(fx); }
  scene.remove(content);
  content.traverse((o) => { o.geometry?.dispose?.(); });
  content = new THREE.Group(); scene.add(content);
  updaters = [];
  scene.fog = null;
}

// ---------------------------------------------------------------- toolbar
function toolbar(extra = []) {
  const tb = $('toolbar'); tb.innerHTML = '';
  const sel = document.createElement('select'); sel.className = 'chip';
  sel.innerHTML = `<option value="">Studio light</option>` + HDRIS.map((h) => `<option value="${h.id}">${h.id.split('/').pop().replaceAll('_', ' ')}</option>`).join('');
  sel.value = settings.hdri;
  sel.onchange = async () => { settings.hdri = sel.value; await applyHdri(); };
  tb.append(sel);
  const toggle = (label, key, apply) => {
    const b = document.createElement('button'); b.className = 'chip' + (settings[key] ? ' on' : ''); b.textContent = label;
    b.onclick = () => { settings[key] = !settings[key]; b.classList.toggle('on', settings[key]); apply(settings[key]); };
    tb.append(b);
  };
  toggle('Sky', 'bg', applyHdri);
  toggle('Bloom', 'bloom', (v) => { stage.bloomPass.enabled = v; });
  toggle('AO', 'ao', (v) => { stage.aoPass.enabled = v; });
  for (const el of extra) tb.append(el);
}
async function applyHdri() {
  await stage.setHdri(settings.hdri ? await lib.hdri(settings.hdri) : null, settings.bg);
  if (scene.fog) scene.fog.color.set(scene.background.isColor ? scene.background : 0x0b0d12);
}
function chip(label, onclick) { const b = document.createElement('button'); b.className = 'chip'; b.textContent = label; b.onclick = onclick; return b; }

function info(title, meta, code) {
  $('info').innerHTML = `<h2>${title}</h2><div class="meta">${meta}</div>` + (code ? `<pre><button class="chip">Copy</button><code></code></pre>` : '');
  if (code) {
    $('info').querySelector('code').textContent = code;
    $('info').querySelector('pre button').onclick = (e) => { navigator.clipboard.writeText(code); e.target.textContent = 'Copied'; };
  }
}
const lic = (a) => `<span class="badge">CC0</span>${a.pack} · <a href="${a.source}" target="_blank" rel="noopener">source</a>`;

// ---------------------------------------------------------------- floor for demo scenes
let floorMat;
async function addFloor(size = 80) {
  floorMat ??= await lib.material('material/MetalPlates006', { repeat: size / 4 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(size, size), floorMat);
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  content.add(floor);
  scene.fog = new THREE.Fog(scene.background, 8, 26); // fade the floor into the background
}

// ---------------------------------------------------------------- models tab
function renderModelList() {
  const q = $('q').value.toLowerCase();
  const groups = {};
  for (const a of models) if (!q || a.id.toLowerCase().includes(q)) (groups[a.group] ??= []).push(a);
  const order = Object.keys(GROUP_LABELS);
  $('list').innerHTML = order.filter((g) => groups[g]).map((g) =>
    `<div class="group-title"><span>${GROUP_LABELS[g]}</span><span>${groups[g].length}</span></div>` +
    groups[g].map((a) => `<button class="item${current === a.id ? ' on' : ''}" data-id="${a.id}">${a.id.split('/').pop()}${a.animations ? `<small>${a.animations.length} anims</small>` : ''}</button>`).join('')
  ).join('');
}

async function showModel(id) {
  current = id;
  document.querySelectorAll('.item').forEach((el) => el.classList.toggle('on', el.dataset.id === id));
  clearContent();
  $('loading').style.display = 'block';
  const a = lib.get(id);
  const m = await lib.model(id, { size: a.group.startsWith('weapons') ? 1.2 : 2 });
  $('loading').style.display = 'none';
  if (current !== id) return;
  content.add(m.object);
  stage.frame(m.object, controls);
  const extra = [];
  if (m.animations.length) {
    const sel = document.createElement('select'); sel.className = 'chip';
    sel.innerHTML = m.animations.map((c) => `<option>${c.name}</option>`).join('');
    const idle = m.animations.find((c) => /idle/i.test(c.name))?.name ?? m.animations[0].name;
    sel.value = idle; m.play(idle);
    sel.onchange = () => m.play(sel.value);
    extra.push(sel);
    updaters.push((dt) => m.mixer.update(dt));
  }
  if (a.group.startsWith('base-characters')) {
    for (const [part, tones] of [['Skin', SKIN_TONES], ['Hair', HAIR_TONES]]) {
      const sel = document.createElement('select'); sel.className = 'chip';
      sel.innerHTML = `<option value="">${part}: original</option>` + Object.keys(tones).map((t) => `<option value="${t}">${part}: ${t}</option>`).join('');
      sel.onchange = () => sel.value && recolor(m.object, { [part]: tones[sel.value] });
      extra.push(sel);
    }
  }
  toolbar(extra);
  const anim = m.animations.length ? `\nm.play('${m.animations[0].name}');  // + m.mixer.update(dt) each frame` : '';
  info(id.split('/').pop(), `${lic(a)} · ${a.format.toUpperCase()}${a.animations ? ` · ${a.animations.length} animations` : ''}`,
    `const m = await lib.model('${id}', { size: 2 });\nscene.add(m.object);${anim}`);
  history.replaceState(null, '', '#' + id);
}


// ---------------------------------------------------------------- garage tab
// One loadout, any vehicle: parts are sized from the car they're mounted on.
const VEHICLE_GROUPS = ['vehicles/racing', 'vehicles/cars', 'vehicles/toon', 'vehicles/city', 'vehicles/classic', 'vehicles/basic'];
// [model id, size as a fraction of car width, weapon ammo or null]
const LIB_PARTS = { turret: ['space/kit/turret_double', 0.32, 'bullet'], minigun: ['turrets/Laser_MachineGun', 0.4, 'bullet'], cannon: ['turrets/Cannon_3', 0.42, 'missile'], blaster: ['weapons/blasters/blaster-h', 0.42, 'bullet'], radar: ['space/kit/satelliteDish', 0.3, null] };
const SLOT_OPTIONS = {
  roof: ['roofRack', 'cargoBox', 'luggage', 'lightBar', 'rocketPod', 'turret', 'minigun', 'radar'],
  hood: ['hoodScoop', 'blaster', 'cannon'], trunk: ['spoiler'], front: ['bullBar'], under: ['underglow'], sides: ['boosters'],
};
const DRIVERS = ['base-characters/people/Casual_Male', 'base-characters/people/Suit_Female', 'base-characters/people/Worker_Male', 'base-characters/modular/Female_Punk', 'base-characters/people/Doctor_Female_Young', 'base-characters/people/Cowboy_Male'];
const PAINT = { original: null, red: 0xc0182a, orange: 0xff6a13, yellow: 0xf2c218, green: 0x1f9e55, blue: 0x1b56c9, purple: 0x6a2bc2, white: 0xeeeeee, black: 0x1a1a1c };
const garage = { id: 'vehicles/cars/Sports', loadout: { roof: 'rocketPod', trunk: 'spoiler', under: 'underglow' }, paint: null, driver: DRIVERS[0], engine: 'race2', drive: true, car: null };

async function buildPart(car, name) {
  if (PARTS[name]) return { part: PARTS[name](car.dims), opts: {} };
  const [id, k, ammo] = LIB_PARTS[name];
  const m = await lib.model(id);
  return { part: m.object, opts: { size: car.dims.w * k, weapon: !!ammo, ammo: ammo ?? undefined } };
}

async function equipSlot(car, slot, name) {
  garage.loadout[slot] = name || undefined;
  if (!name) { car.unequip(slot); return; }
  const { part, opts } = await buildPart(car, name);
  if (garage.car === car) car.equip(slot, part, opts);
}

function garageList() {
  const groups = {};
  for (const a of models) if (VEHICLE_GROUPS.includes(a.group)) (groups[a.group] ??= []).push(a);
  $('list').innerHTML = VEHICLE_GROUPS.filter((g) => groups[g]).map((g) =>
    `<div class="group-title"><span>${GROUP_LABELS[g]}</span><span>${groups[g].length}</span></div>` +
    groups[g].map((a) => `<button class="item${garage.id === a.id ? ' on' : ''}" data-id="${a.id}">${a.id.split('/').pop()}</button>`).join('')).join('');
  $('list').onclick = (e) => { const b = e.target.closest('.item'); if (b) { garage.id = b.dataset.id; showGarage(); } };
}

function select(label, options, value, onchange) {
  const sel = document.createElement('select'); sel.className = 'chip';
  sel.innerHTML = options.map(([v, t]) => `<option value="${v}">${label}: ${t}</option>`).join('');
  sel.value = value ?? ''; sel.onchange = () => onchange(sel.value);
  return sel;
}

function garageCode() {
  const lo = Object.entries(garage.loadout).filter(([, v]) => v);
  const lines = lo.map(([slot, n]) => PARTS[n] ? `car.equip('${slot}', PARTS.${n}(car.dims));` : `car.equip('${slot}', (await lib.model('${LIB_PARTS[n][0]}')).object, { size: car.dims.w * ${LIB_PARTS[n][1]}${LIB_PARTS[n][2] ? `, weapon: true, ammo: '${LIB_PARTS[n][2]}'` : ''} });`);
  return `import { loadVehicle } from './src/vehicle.js';
import { PARTS } from './src/parts.js';
const car = await loadVehicle(lib, '${garage.id}', { length: 4.2 });
scene.add(car.object);
${lines.join('\n')}${garage.paint != null ? `\ncar.paint(0x${garage.paint.toString(16).padStart(6, '0')});` : ''}${garage.driver ? `\nawait car.addDriver(lib, '${garage.driver}');` : ''}
car.engine(sfx, '${garage.engine}');
// every frame: car.update(dt, { speed, steer });
// car.transform('combat' | 'boost' | 'hover', { vfx, sfx });   car.fire(vfx, sfx, target);`;
}

async function showGarage() {
  clearContent(); current = null; await addFloor();
  garageList();
  $('loading').style.display = 'block';
  const id = garage.id;
  const car = await loadVehicle(lib, id, { length: 4.2 });
  $('loading').style.display = 'none';
  if (tab !== 'garage' || garage.id !== id) return;
  garage.car?.stopEngine();
  garage.car = car;
  content.add(car.object);
  for (const [slot, name] of Object.entries(garage.loadout)) if (name) await equipSlot(car, slot, name);
  if (garage.paint != null) car.paint(garage.paint);
  if (garage.driver) await car.addDriver(lib, garage.driver);
  car.engine(sfx, garage.engine, { volume: 0.35 });
  camera.position.set(10, 5.5, 11); controls.target.set(0, 0.6, 0); controls.update();
  window.__garage = garage;

  // drive in a circle, or sit on a slow turntable
  let ang = 0;
  const R = 5.5;
  updaters.push((dt) => {
    if (garage.drive) {
      const speed = 9;
      ang += (speed / R) * dt;
      car.object.position.set(Math.cos(ang) * R, 0, Math.sin(ang) * R);
      car.object.rotation.y = -ang;   // tangent of the circle (+Z forward)
      car.update(dt, { speed, steer: Math.atan(car.dims.l * 0.6 / R) });
    } else {
      car.object.position.set(0, 0, 0);
      car.object.rotation.y += dt * 0.25;
      car.update(dt, { speed: 0, steer: Math.sin(performance.now() / 900) * 0.35 });
    }
  });

  const T = (label, fn) => chip(label, fn);
  const opt = (names) => [['', 'none'], ...names.map((n) => [n, n.replace(/([A-Z])/g, ' $1').toLowerCase()])];
  const extra = [
    select('Paint', Object.keys(PAINT).map((k) => [k, k]), Object.keys(PAINT).find((k) => PAINT[k] === garage.paint) ?? 'original', (v) => { garage.paint = PAINT[v]; if (PAINT[v] != null) car.paint(PAINT[v]); else showGarage(); }),
    ...Object.entries(SLOT_OPTIONS).map(([slot, names]) => select(slot[0].toUpperCase() + slot.slice(1), opt(names), garage.loadout[slot], async (v) => { await equipSlot(car, slot, v); garageInfo(); })),
    select('Driver', [['', 'none'], ...DRIVERS.map((d) => [d, d.split('/').pop()])], garage.driver, async (v) => { garage.driver = v || null; if (v) await car.addDriver(lib, v); else car.removeDriver(); garageInfo(); }),
    select('Engine', Object.keys(ENGINE_LOOPS).map((k) => [k, k]), garage.engine, (v) => { garage.engine = v; car.engine(sfx, v, { volume: 0.35 }); garageInfo(); }),
    T(garage.drive ? 'Park' : 'Drive', (e) => { garage.drive = !garage.drive; e.target.textContent = garage.drive ? 'Park' : 'Drive'; }),
    T('Combat mode', async () => { await car.transform('combat', { vfx, sfx }); garage.loadout.roof = garage.loadout.roof ?? 'rocketPod'; }),
    T('Fire', () => {
      const ahead = new THREE.Vector3(0, 0, 14).applyQuaternion(car.object.quaternion).add(car.object.position).setY(0);
      car.fire(vfx, sfx, ahead);
    }),
    T('Boost', () => car.transform('boost', { vfx, sfx, duration: 2.5 })),
    T('Hover', () => car.transform('hover', { vfx, sfx })),
    T('Horn', () => sfx.play('horn', { position: car.object.position })),
  ];
  toolbar(extra);
  garageInfo();
}

function garageInfo() {
  const a = lib.get(garage.id);
  info(garage.id.split('/').pop(), `${lic(a)} · ${a.format.toUpperCase()} · ${garage.car?.wheels.length ?? 0} wheels rigged · slots: ${garage.car?.slots.join(', ')}`, garageCode());
}

// ---------------------------------------------------------------- VFX tab
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const VFX_DEMOS = {
  'Explosion': () => { const p = V(rnd(-1.5, 1.5), 0.4, rnd(-1.5, 1.5)); vfx.explosion(p); sfx.play('explosion', { position: p }); },
  'Muzzle flash': () => fireGun(),
  'Laser': () => {
    const from = V(-4, 1.4, 0);
    vfx.laser(from, V(rnd(-0.5, 0.5), rnd(0.6, 2), rnd(-0.5, 0.5)), { color: [0xff2a4a, 0x2affb0, 0x4fa8ff][Math.floor(Math.random() * 3)] });
    sfx.play('laser', { position: from });
  },
  'Impact': () => { const p = V(rnd(-1, 1), 0.05, rnd(-1, 1)); vfx.impact(p); sfx.play('impactMetal', { position: p }); },
  'Shield hit': () => {
    if (!demo.shield) return;
    const p = randomOnSphere(demo.shield.mesh);
    vfx.laser(V(-1, 2.2, -3), p, { color: 0xff8a3a, impact: false });
    demo.shield.hit(p); sfx.play('shield', { position: p });
  },
  'Lightning': () => { const to = V(rnd(-1, 1), 0.05, rnd(-1, 1)); vfx.lightning(V(rnd(-1, 1), 4, rnd(-2, 0)), to); sfx.play('zap', { position: to }); },
  'EMP': () => { const p = V(rnd(-1, 0), 0.6, rnd(-0.5, 0.5)); vfx.emp(p, { radius: 3 }); sfx.play('explosionBig', { position: p }); },
  'Teleport': () => { const p = V(rnd(-2, -0.5), 0, rnd(0.5, 1.5)); vfx.teleport(p); sfx.play('phaseJump', { position: p }); },
  'Charge-up': async () => {
    const p = V(-1.5, 1.6, 1); sfx.play('powerUp', { position: p });
    await vfx.chargeUp(p, { duration: 0.9 });
    vfx.laser(p, demo.mech.object.position.clone().setY(1.2), { color: 0xffb84a, width: 0.12 }); sfx.play('laserHeavy', { position: p });
  },
  'Damage': () => {
    if (!demo.mech) return;
    const head = demo.mech.object.position.clone().setY(2.3);
    vfx.hitFlash(demo.mech.object, { color: 0xff5a3a });
    const crit = Math.random() < 0.3;
    vfx.damageNumber(head, crit ? `${Math.floor(rnd(80, 140))}!` : Math.floor(rnd(8, 40)), { color: crit ? '#ffcc33' : '#ffffff' });
    sfx.play('punch', { position: head });
  },
};
const demo = {};
const rnd = (a, b) => a + Math.random() * (b - a);
function randomOnSphere(mesh) {
  const r = mesh.geometry.parameters.radius;
  const d = new THREE.Vector3(rnd(-1, -0.3), rnd(-0.1, 0.6), rnd(-0.8, 0.2)).normalize(); // side facing the attacker
  return mesh.position.clone().addScaledVector(d, r * mesh.scale.x);
}
function fireGun() {
  if (!demo.gun) return;
  const muzzle = new THREE.Vector3(); demo.muzzle.getWorldPosition(muzzle);
  const dir = new THREE.Vector3(-1, 0, 0).applyQuaternion(demo.gun.getWorldQuaternion(new THREE.Quaternion()));
  vfx.muzzleFlash(muzzle, dir);
  sfx.play('blaster', { position: muzzle, volume: 0.7 });
  demo.gun.position.x += 0.05; // recoil
}

async function showVfx() {
  clearContent(); current = null; await addFloor();
  const mech = await lib.model('mechs/Stan', { size: 2.2 });
  mech.object.position.set(2.6, 0, -0.5); mech.object.rotation.y = -Math.PI / 2; mech.play('Idle');
  content.add(mech.object); updaters.push((dt) => mech.mixer.update(dt));
  demo.mech = mech;
  demo.shield = vfx.shield(mech.object, { color: 0x4fc3ff });
  vfx.healAura(mech.object, { color: 0x46ff9a, radius: 1 });

  const gunM = await lib.model('weapons/blasters/blaster-b', { size: 0.8 });
  const gunPivot = new THREE.Group(); gunPivot.position.set(-3, 1.2, 1.6); gunPivot.rotation.y = Math.PI / 2;
  gunPivot.add(gunM.object); content.add(gunPivot); demo.gun = gunM.object;
  demo.muzzle = new THREE.Object3D(); demo.muzzle.position.set(0, 0.22, -0.55); gunPivot.add(demo.muzzle);
  updaters.push(() => { demo.gun.position.x *= 0.85; });

  const portal = vfx.portal(new THREE.Vector3(0, 1.6, -4), { color: 0x9a5cff, radius: 1.3 });
  void portal;

  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), new THREE.MeshStandardMaterial({ emissive: 0x6ae3ff, emissiveIntensity: 6, color: 0 }));
  content.add(orb); vfx.trail(orb, { color: 0x6ae3ff, width: 0.22, length: 50 });
  let t = 0;
  updaters.push((dt) => { t += dt; orb.position.set(Math.cos(t * 1.6) * 2.4, 1.5 + Math.sin(t * 3.2) * 0.5, Math.sin(t * 1.6) * 2.4); });

  // auto demo loop (silent until the viewer clicks, since browsers block autoplaying audio)
  let timer = 0, step = 0; const names = Object.keys(VFX_DEMOS);
  updaters.push((dt) => { timer += dt; if (timer > 1.3) { timer = 0; VFX_DEMOS[names[step++ % names.length]](); } });

  camera.position.set(-1, 4.2, 10.5); controls.target.set(0, 0.8, -0.5); controls.update();
  toolbar(names.map((n) => chip(n, VFX_DEMOS[n])));
  info('VFX', 'Written for this library · instanced particles, sprite textures from Kenney Particle Pack (CC0)',
`const vfx = await new VFX(scene).init();   // then vfx.update(dt, camera) each frame
vfx.explosion(pos, { scale: 1 });
vfx.muzzleFlash(muzzlePos, aimDir);
vfx.laser(from, to, { color: 0xff2a4a });
vfx.impact(point, normal);
const s = vfx.shield(mech);  s.hit(point);
vfx.lightning(from, to);  vfx.emp(pos);  vfx.teleport(pos);
await vfx.chargeUp(pos);  vfx.healAura(mech);
vfx.hitFlash(mech);  vfx.damageNumber(pos, 42);
vfx.trail(bullet);  vfx.portal(pos);  vfx.pickupBurst(pos);
sfx.play('laser', { position: from });   // src/sfx.js`);
  renderSimpleList(names.map((n) => ({ label: n, run: VFX_DEMOS[n] })));
}

// ---------------------------------------------------------------- power-ups tab
async function showPowerups() {
  clearContent(); current = null; await addFloor();
  const types = Object.keys(POWERUP_TYPES);
  const pickups = types.map((type, i) => {
    const p = createPowerUp(type);
    p.object.position.set((i - (types.length - 1) / 2) * 1.8, 0, 0);
    content.add(p.object);
    updaters.push((dt) => p.update(dt));
    return p;
  });
  const collect = (p) => { p.collect(vfx); sfx.play('powerUp'); setTimeout(() => p.reset(), 1500); };
  const dist = Math.max(7.5, 9.5 / camera.aspect + 3); // keep the whole row in view on narrow screens
  camera.position.set(0, dist * 0.4, dist); controls.target.set(0, 0.9, 0); controls.update();
  toolbar([chip('Collect all', () => pickups.forEach((p, i) => setTimeout(() => collect(p), i * 120)))]);
  info('Power-ups', 'Procedural, written for this library · no external files',
`import { createPowerUp } from './src/powerups.js';
const p = createPowerUp('${types.join("' | '")}');
scene.add(p.object);   p.update(dt);   p.collect(vfx);`);
  renderSimpleList(pickups.map((p) => ({ label: p.type, run: () => collect(p) })));
}

// ---------------------------------------------------------------- materials tab
async function showMaterials(id) {
  clearContent(); current = id;
  const mats = lib.find({ type: 'material' });
  id ??= mats[0].id;
  const a = lib.get(id);
  const mat = await lib.material(id, { repeat: 1 });
  const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.9, 96, 64), mat);
  sphere.geometry.setAttribute('uv2', sphere.geometry.attributes.uv);
  sphere.position.set(-1.1, 0.9, 0);
  const box = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), mat); box.position.set(1.1, 0.75, 0);
  for (const m of [sphere, box]) { m.castShadow = m.receiveShadow = true; content.add(m); }
  updaters.push((dt) => { sphere.rotation.y += dt * 0.3; box.rotation.y -= dt * 0.2; });
  camera.position.set(0, 2.2, 5); controls.target.set(0, 0.8, 0); controls.update();
  toolbar();
  info(id.split('/').pop(), `${lic(a)} · maps: ${a.maps.join(', ')}`, `const mat = await lib.material('${id}', { repeat: 2 });\nmesh.material = mat;`);
  renderSimpleList(mats.map((m) => ({ label: m.id.split('/').pop(), run: () => showMaterials(m.id), on: m.id === id })));
}

// ---------------------------------------------------------------- audio tab
const SOUND_LABELS = { 'audio/car': 'Car', 'audio/racing': 'Racing', 'audio/engine-loops': 'Engine loops', 'audio/car-extra': 'Car: start, doors, blinkers', 'audio/car-acceleration': 'Car: acceleration', 'audio/rocket': 'Rocket engine', 'audio/sci-fi': 'Sci-fi', 'audio/impact': 'Impacts & footsteps', 'audio/interface': 'Interface', 'audio/digital': 'Digital / retro' };
async function showAudio() {
  clearContent(); current = null; await addFloor();
  const p = createPowerUp('energy'); content.add(p.object); updaters.push((dt) => p.update(dt));
  camera.position.set(0, 2.4, 5); controls.target.set(0, 0.9, 0); controls.update();
  toolbar(Object.keys(SFX_PRESETS).slice(0, 8).map((n) => chip(n, () => sfx.play(n))));
  info('Audio', `${sounds.length} sound effects · <span class="badge">CC0</span>Kenney sound packs · click any sound to play it`,
`import { SoundBoard } from './src/sfx.js';
const sfx = new SoundBoard(camera).attach(scene);
sfx.play('explosion', { position: hitPos });   // 3D, random variant + pitch
sfx.play('click');                              // 2D UI sound
// presets: ${Object.keys(SFX_PRESETS).join(', ')}`);
  const groups = {};
  for (const s of sounds) (groups[s.group] ??= []).push(s);
  $('list').innerHTML = Object.keys(SOUND_LABELS).filter((g) => groups[g]).map((g) =>
    `<div class="group-title"><span>${SOUND_LABELS[g]}</span><span>${groups[g].length}</span></div>` +
    groups[g].map((s) => `<button class="item" data-id="${s.format === 'ogg' ? s.id : s.path}">${s.id.split('/').pop()}</button>`).join('')).join('');
  $('list').onclick = (e) => {
    const b = e.target.closest('.item'); if (!b) return;
    document.querySelectorAll('.item.on').forEach((el) => el.classList.remove('on')); b.classList.add('on');
    sfx.play(b.dataset.id, { pitch: 0 });
  };
}

function renderSimpleList(items) {
  $('list').innerHTML = items.map((it, i) => `<button class="item${it.on ? ' on' : ''}" data-i="${i}">${it.label}</button>`).join('');
  $('list').onclick = (e) => { const b = e.target.closest('.item'); if (b) items[+b.dataset.i].run(); };
}

// ---------------------------------------------------------------- wiring
async function setTab(t) {
  tab = t;
  garage.car?.stopEngine(); garage.car = null;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  $('q').parentElement.style.display = t === 'models' ? '' : 'none';
  if (t === 'models') {
    $('list').onclick = (e) => { const b = e.target.closest('.item'); if (b) showModel(b.dataset.id); };
    renderModelList();
    await showModel(current && lib.byId.has(current) && lib.get(current).type === 'model' ? current : 'mechs/George');
  } else if (t === 'garage') await showGarage();
  else if (t === 'vfx') await showVfx();
  else if (t === 'powerups') await showPowerups();
  else if (t === 'audio') await showAudio();
  else await showMaterials();
}
$('tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); };
$('q').oninput = renderModelList;

const hash = decodeURIComponent(location.hash.slice(1));
if (['vfx', 'powerups', 'materials', 'audio'].includes(hash)) setTab(hash);
else { if (lib.byId.has(hash)) current = hash; setTab('models'); }
window.__stage = stage; window.__lib = lib; window.__vfx = vfx; window.__sfx = sfx;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const u of updaters) u(dt);
  vfx.update(dt, camera);
  controls.update();
  stage.render();
});
</script>
